name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-frontend:
    uses: ./.github/workflows/build-frontend.yml

  test-python:
    name: test python
    needs: build-frontend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: download repo with built frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: repo-with-frontend
          path: .

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: install tangram (no plugins)
        run: uv sync --all-groups --package tangram_core

      - name: run tests
        env:
          TANGRAM_CONFIG_PATH: tangram.example.toml
        run: uv run pytest packages/tangram_core/tests/

      - name: install tangram (all plugins)
        run: uv sync --all-groups --all-packages

      - name: check plugin dependencies
        run: uv run tangram check-plugin --all
