name: Channel Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/tangram_core/rust/**'
  pull_request:
    paths:
      - 'packages/tangram_core/rust/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: packages/tangram_core/rust

    - name: Run Channel Tests
      working-directory: packages/tangram_core/rust
      run: cargo test --features channel
      env:
        REDIS_URL: redis://localhost:6379