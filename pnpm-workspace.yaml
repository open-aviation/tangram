packages:
  - packages/*

overrides:
  "@scarf/scarf": link:packages/tangram_weather/vendor/scarf-disabled

# tangram_navaid -> trafficjs -> onnxruntime-web -> protobufjs uses build scripts
# but we don't use onnx anyway
allowBuilds:
  protobufjs: false

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - traffic.js
