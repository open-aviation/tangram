[workspace]
resolver = "3"
members = [
    "packages/tangram_core/rust",
    "packages/tangram_history/rust",
    "packages/tangram_jet1090/rust",
    "packages/tangram_ship162/rust",
    "packages/tangram_datalink/rust"
]

[workspace.package]
license = "AGPL-3.0"
edition = "2021"
readme = "readme.md"
version = "0.6.0"
repository = "https://github.com/open-aviation/tangram"
homepage = "https://mode-s.org/tangram/"
documentation = "https://mode-s.org/tangram/"

# following profiles are largely lifted from https://github.com/pola-rs/polars/blob/main/Cargo.toml
[profile.dev]
debug = "line-tables-only"

[profile.debug-dev]
inherits = "dev"
debug = true

# on github actions, tangram_history (which effectively compiles datafusion)
# with lto = 'fat' takes a huge amount of time and memory:
# - SIGABRT on manylinux (i686) due to Rust-LLVM OOM
# - SIGKILL on {many,musl}linux (armv7, aarch64)
# we therefore pick a less aggressive lto, resulting in a ~3x shorter compile
# time at the cost of increasing binary size by ~30%.
[profile.release]
lto = "thin"
debug = "line-tables-only"

# sql parsing and planning are cold relative to query execution
[profile.release.package.sqlparser]
opt-level = "s"

[profile.release.package.datafusion-sql]
opt-level = "s"

[profile.debug-release]
inherits = "release"
debug = true
strip = "none"

[profile.nodebug-release]
inherits = "release"
debug = false
strip = "symbols"

[profile.dist-release]
inherits = "release"
codegen-units = 1
debug = false
strip = "symbols"
